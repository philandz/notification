[package]
name = "notification"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tonic-build = "0.12"

[dependencies]
axum = "0.8.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
tracing = "0.1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "macros", "chrono", "uuid", "migrate"] }
tonic = "0.12"
prost = "0.13"
philand_logging     = { package = "logging",     path = "../libs/logging" }
philand_configs     = { package = "configs",     path = "../libs/configs" }
philand_application = { package = "application", path = "../libs/application" }
philand_storage     = { package = "storage",     path = "../libs/storage" }
philand_notify      = { package = "notify",      path = "../libs/notify" }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
